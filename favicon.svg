<!-- Ground and mark track the CURRENT brand. The amber #f0b429 on #151210 this
     replaces was the pre-2026-08-13 palette; index.html records the accent moving
     off green that day and the warm browns going neutral after. The tab was two
     brand changes behind and shared no colour with the page it labels — and
     apple-touch-icon.png was a THIRD palette again, #4ade80 on #0c110e, so the
     two icons did not even match each other. The PNG is now rendered FROM this
     file rather than drawn separately, so they cannot diverge again. -->
