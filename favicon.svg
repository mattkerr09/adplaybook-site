<rect width="100" height="100" rx="22" fill="#0B0B0D"/>
<rect x="14" y="14" width="14" height="72" rx="4" fill="#FAFAF8"/>
<rect x="33" y="14" width="53" height="72" rx="6" fill="#FAFAF8"/>
